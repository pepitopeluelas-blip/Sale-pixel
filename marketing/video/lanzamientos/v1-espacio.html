<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><title>Safe Pixel · Lanzamiento (espacio)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* Estilo 1: azul cósmico, revelación de logo con estelas. 14 s */
.stage{background:radial-gradient(ellipse at 50% 40%,#123a8a 0%,#081a45 45%,#030a1f 100%);color:#eaf0ff}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.6;animation:tw 2.4s ease-in-out var(--t) infinite both}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.planet{position:absolute;left:-30%;right:-30%;top:1180px;height:1600px;border-radius:50%;background:radial-gradient(ellipse at 50% 0%,#2c6bff55,#0a1f5a 30%,#030a1f 60%);box-shadow:0 -6px 80px #4f8cff66}
.streak{position:absolute;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,#ff8a3d,#fff);opacity:0;animation:shoot 1.1s ease-in var(--t) both}
@keyframes shoot{0%{opacity:0;transform:translateX(-900px)}20%{opacity:1}100%{opacity:0;transform:translateX(1500px)}}
.logo.fly i{animation:fly 1s cubic-bezier(.2,.9,.2,1) calc(var(--s) + var(--k)*.12s) both;box-shadow:0 0 50px #7fb0ff}
@keyframes fly{from{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg) scale(.2)}to{opacity:1;transform:none}}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#5b8cff55,transparent 65%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
h1{font-size:128px;font-weight:700}
h2{font-size:96px;font-weight:700;color:#fff}
h2 em{font-style:normal;color:#ff9a52}
.pill{display:inline-block;margin:16px 0;padding:30px 56px;border-radius:70px;border:2px solid #4f7dff88;background:#0c2366cc;font:600 52px Inter;box-shadow:0 0 50px #2f5cff55}
.price{font-size:220px;font-weight:700;color:#fff}
.wa{background:#ff8a3d;color:#1a0a00}.wa svg{fill:#1a0a00}
</style></head><body><div class="stage">
<i class="star" style="left:120px;top:200px;--t:.1s"></i><i class="star" style="left:860px;top:320px;--t:.7s"></i><i class="star" style="left:400px;top:120px;--t:1.3s"></i>
<i class="star" style="left:980px;top:900px;--t:.4s"></i><i class="star" style="left:60px;top:1000px;--t:1.8s"></i><i class="star" style="left:640px;top:520px;--t:1s"></i>
<i class="star" style="left:250px;top:700px;--t:2s"></i><i class="star" style="left:760px;top:1100px;--t:.2s"></i>
<div class="planet"></div>
<i class="streak" style="top:420px;width:700px;--t:3.2s"></i><i class="streak" style="top:540px;width:420px;--t:3.6s"></i><i class="streak" style="top:1380px;width:560px;--t:4.1s"></i>

<section class="scene" style="--s:0s;--d:3.2s">
  <div class="glow"></div>
  <div class="logo fly" style="--q:110px"><i style="--k:0;--x:-600px;--y:-700px"></i><i style="--k:1;--x:600px;--y:-700px"></i><i style="--k:2;--x:-600px;--y:700px"></i><i style="--k:3;--x:600px;--y:700px"></i></div>
  <h1 class="gs in" style="--i:5;margin-top:70px">Safe Pixel</h1>
</section>
<section class="scene" style="--s:3.2s;--d:3.4s">
  <h2 class="gs in">Tu negocio merece <em>despegar</em> en internet.</h2>
</section>
<section class="scene" style="--s:6.6s;--d:3.8s">
  <span class="pill pop" style="--i:0">🌐 Páginas web</span>
  <span class="pill pop" style="--i:2">💬 Chatbots de WhatsApp</span>
  <span class="pill pop" style="--i:4">🧾 Punto de venta</span>
</section>
<section class="scene last" style="--s:10.4s;--d:3.6s">
  <p class="in" style="font:600 50px Inter;opacity:.8">Tu página desde</p>
  <div class="price gs in" style="--i:1">$1,999</div>
  <div class="cta in" style="--i:3;margin-top:40px"><span class="wa"><svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8 1 3.9.8a3.3 3.3 0 0 0 2.1-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4z"/></svg> 55 6780 7245</span></div>
  <p class="foot">safepixels.com.mx</p>
</section>
</div><script>window.seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});</script></body></html>
