<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono&family=Inter:ital,wght@0,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Portada Facebook 1640x856. Zona segura (se ve en celular y computadora): centro 1200x480 */
  html,body{margin:0;width:1640px;height:856px;background:#070707;color:#f2f2f2;font-family:Inter}
  .s{position:relative;width:1640px;height:856px;overflow:hidden;
     background:radial-gradient(ellipse at 60% 40%,#1f1f1f,#070707 65%)}
  .grid{position:absolute;inset:0;opacity:.18;
     background-image:linear-gradient(#ffffff22 2px,transparent 2px),linear-gradient(90deg,#ffffff22 2px,transparent 2px);
     background-size:82px 82px}
  .px{position:absolute;width:30px;height:30px;border-radius:6px;background:#fff}
  .safe{position:absolute;left:220px;top:188px;width:1200px;height:480px;display:flex;align-items:center;justify-content:space-between}
  .txt .mono{font:400 22px "Space Mono";letter-spacing:.14em;color:#8c8c8c;text-transform:uppercase}
  .txt{max-width:760px}.txt h1{font:700 70px/1.04 "Space Grotesk";letter-spacing:-.04em;margin:18px 0 20px;color:#9a9a9a}
  .txt h1 b{color:#fff}.txt h1 em{font-family:Inter;font-style:italic;font-weight:600;color:#fff}
  .tags{display:flex;gap:12px;flex-wrap:wrap}
  .tags span{padding:10px 20px;border:2px solid #333;border-radius:40px;font-size:22px;color:#cfcfcf}
  .card{width:360px;padding:34px;border-radius:30px;background:#f2f2f2;color:#070707;text-align:center}
  .card .p{font:700 66px "Space Grotesk";letter-spacing:-.04em}
  .card small{display:block;font-size:20px;color:#555;margin-bottom:6px}
  .card .wa{margin-top:18px;padding:14px 10px;border-radius:40px;background:#070707;color:#fff;font:600 22px Inter;white-space:nowrap}
</style></head>
<body><div class="s">
  <div class="grid"></div>
  <i class="px" style="left:120px;top:110px;opacity:.5"></i><i class="px" style="left:1480px;top:720px;opacity:.4"></i>
  <i class="px" style="left:1520px;top:90px;opacity:.25"></i><i class="px" style="left:90px;top:700px;opacity:.3"></i>
  <div class="safe">
    <div class="txt">
      <p class="mono">// Safe Pixel · Tultitlán</p>
      <h1><b>Páginas web</b> y sistemas<br>que hacen <em>vender</em> a tu negocio</h1>
      <div class="tags"><span>Páginas web</span><span>Menú en WhatsApp</span><span>Punto de venta</span><span>Hosting</span></div>
    </div>
    <div class="card"><small>Tu página desde</small><div class="p">$1,999</div><small>MXN · cotiza gratis</small>
      <div class="wa">WhatsApp 55 6780 7245</div></div>
  </div>
</div></body></html>
