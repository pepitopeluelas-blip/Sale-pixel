<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:720px;height:720px;background:#070707}
  .s{width:720px;height:720px;display:grid;place-items:center;
     background:radial-gradient(circle at 50% 45%,#262626,#070707 70%)}
  .g{display:grid;grid-template-columns:repeat(2,170px);gap:34px}
  .g i{width:170px;height:170px;border-radius:38px;background:#fff}
  .g i:nth-child(2){background:#8c8c8c}.g i:nth-child(3){background:#5c5c5c}.g i:nth-child(4){background:#d4d4d4}
</style></head>
<body><div class="s"><div class="g"><i></i><i></i><i></i><i></i></div></div></body></html>
